[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synopsys-adhd-classifier"
version = "0.1.0"
description = "ADHD classifier utilities converted from a Google Colab notebook."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[project.scripts]
synopsys-adhd-train = "synopsys_adhd_classifier.train:main"

[tool.setuptools.packages.find]
where = ["src"]
